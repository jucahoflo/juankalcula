<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JUANKALCULA PRO</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1 class="logo">JUANKALCULA</h1>
            <nav class="menu">
                <button class="menu-btn" onclick="setMode('Calculadora')">Calculadora</button>
                <button class="menu-btn" onclick="setMode('Resistencia')">Resistencia</button>
                <button class="menu-btn" onclick="setMode('Capacitor')">Capacitor</button>
                <button class="menu-btn" onclick="setMode('Identificar')">Identificar</button>
                <button class="menu-btn" onclick="setMode('E96')">E96</button>
                <button class="menu-btn active" onclick="setMode('Datasheet')">Datasheet</button>
            </nav>
            <div class="sidebar-footer">
                <p id="footer-text">DATASHEET</p>
            </div>
        </aside>

        <main class="main-content">
            <div class="display-container">
                <div class="mode-indicator" id="current-mode">MODO: DATASHEET</div>
                <div class="result-screen" id="result">
                    <p style="color: #666;">Ingresa un componente...</p>
                </div>
            </div>

            <div class="keyboard">
                <div class="input-row">
                    <input type="text" id="input-value" placeholder="Escribe aquí..." autocomplete="off">
                </div>
                <div class="keys-grid">
                    </div>
                <button class="decode-btn" id="btn-decode">DECODIFICAR</button>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
