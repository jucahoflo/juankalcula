<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUANKALCULA PRO</title>
    <meta name="theme-color" content="#00ffc3">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">
    <div class="sidebar">
        <h2>JUANKALCULA</h2>
        <button onclick="setMode('calc')">Calculadora</button>
        <button onclick="setMode('resistor')">Resistencia</button>
        <button onclick="setMode('capacitor')">Capacitor Código</button>
        <button onclick="setMode('identify')">Identificar</button>
        <button onclick="setMode('e96')">E96</button>
        <button onclick="setMode('semiconductor')">Semiconductores Datasheet</button>

        <div id="componentViewer" style="margin-top: 30px; text-align: center; border-top: 1px solid #333; padding-top: 15px;">
            <img id="componentImg" src="images/calculadora.png" alt="" style="width: 80px; filter: drop-shadow(0 0 5px #00ffc3);">
            <div id="componentName" style="color: #00ffc3; font-size: 10px; margin-top: 5px; font-weight: bold;">CALCULADORA</div>
        </div>
    </div>

    <div class="main">
        <div class="display">
            <div id="modeIndicator">MODO: CALCULADORA</div>
            <div id="operation">0</div>
            <div id="result">0</div>
        </div>

        <div class="keys" id="keys"></div>

        <button class="execute" onclick="run()">DECODIFICAR</button>

        <div id="pdfPanel" class="pdf-panel hidden">
            <div class="pdf-toolbar">
                <span id="pdfTitle">Datasheet</span>
                <a id="openPdfBtn" class="pdf-open-btn" href="#" target="_blank">Abrir aparte</a>
            </div>
            <div id="pdfOptions" class="pdf-options"></div>
            <iframe id="pdfFrame" class="pdf-frame" src=""></iframe>
        </div>
    </div>
</div>

<script src="js/calculator.js"></script>
<script src="modules/resistorDecoder.js"></script>
<script src="modules/capacitorDecoder.js"></script>
<script src="modules/E96Decoder.js"></script>
<script src="modules/smdIdentifier.js"></script>
<script src="modules/semiconductorDatasheet.js"></script>
<script src="js/main.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("PWA lista"))
    .catch(err => console.log("SW error", err));
}
</script>
</body>
</html>
